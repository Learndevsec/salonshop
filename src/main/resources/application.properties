spring.application.name=salonshop-backend

# Supabase Postgres connection
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Supabase Auth
supabase.url=${SUPABASE_URL:https://YOUR_PROJECT_REF.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:YOUR_SUPABASE_ANON_KEY}

# Validate JWT tokens issued by Supabase
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://YOUR_PROJECT_REF.supabase.co/auth/v1}
